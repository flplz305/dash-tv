<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ciclo de Dashboards</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #000;
      overflow: hidden;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="lookerFrame"></iframe>
  <script>
    const dashboards = [
      "https://lookerstudio.google.com/embed/reporting/b6b28955-f492-46c1-af56-76c2b7bd0dae/page/p_g4doowqmxd",
      "https://lookerstudio.google.com/embed/reporting/22049608-7769-4771-950c-f8e0715b3813/page/qzTwE",
      "https://lookerstudio.google.com/embed/reporting/b6b28955-f492-46c1-af56-76c2b7bd0dae/page/p_5082emfywd",
    ];
    let index = 0;
    const intervalTime = 120000;
    function cycle() {
      const frame = document.getElementById("lookerFrame");
      frame.src = dashboards[index];
      index = (index + 1) % dashboards.length;
    }
    cycle();
    setInterval(cycle, intervalTime);
    setInterval(() => {
      const frame = document.getElementById("lookerFrame");
      frame.src = frame.src;
    }, 600000);
  </script>
</body>
</html>
